services:
  - type: web
    name: campus-guide-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free # Use the free instance plan
    # Environment Variables will be set directly in the Render dashboard for security.
    # The $PORT variable is automatically provided by Render.